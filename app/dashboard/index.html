<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FC26 ClubOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e8e8e8; }
header { padding: 16px 20px; background: #171a21; position: sticky; top: 0; z-index: 2; }
h1, h2 { margin: 0 0 8px; }
main { padding: 20px; display: grid; gap: 20px; }
section { background: #171a21; border-radius: 14px; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 12px; }
.card { background: #202531; padding: 12px; border-radius: 12px; }
button, input { border-radius: 10px; border: 1px solid #2f3647; background: #0f1115; color: #e8e8e8; padding: 10px 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid #2b3140; }
small.muted { color: #97a1b3; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.tab { cursor:pointer; }
.hidden { display:none; }
.badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#2b3140; font-size:12px; }
.low { background:#6b2737; }
.medium { background:#6e5c1d; }
.high { background:#2c5b3a; }
pre { white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>FC26 ClubOS</h1>
  <small class="muted">Local dashboard, CSV history, resolver queue, image manifest, local web service mode</small>
  <div class="tabs">
    <button class="tab" onclick="showTab('summary')">Summary</button>
    <button class="tab" onclick="showTab('players')">Players</button>
    <button class="tab" onclick="showTab('history')">CSV History</button>
    <button class="tab" onclick="showTab('queue')">Resolver Queue</button>
    <button class="tab" onclick="showTab('manifest')">Manifest</button>
    <button class="tab" onclick="refreshNow()">Refresh</button>
  </div>
</header>
<main>
  <section id="summary">
    <h2>Summary</h2>
    <div id="summaryGrid" class="grid"></div>
  </section>

  <section id="players" class="hidden">
    <h2>Players</h2>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input id="playerQuery" placeholder="Search player, team or rarity">
      <button onclick="loadPlayers()">Search</button>
    </div>
    <div id="playersTable"></div>
  </section>

  <section id="history" class="hidden">
    <h2>CSV Version History Browser</h2>
    <div id="historyTable"></div>
    <h3 style="margin-top:16px;">Selected snapshot players</h3>
    <div id="historyPlayers"></div>
  </section>

  <section id="queue" class="hidden">
    <h2>Resolver Queue</h2>
    <div id="queueTable"></div>
  </section>

  <section id="manifest" class="hidden">
    <h2>Manifest</h2>
    <div id="manifestTable"></div>
  </section>
</main>

<script>
const api = path => fetch(path).then(r => r.json());

function showTab(id){
  for (const sec of document.querySelectorAll('main > section')) sec.classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
  if (id === 'summary') loadSummary();
  if (id === 'players') loadPlayers();
  if (id === 'history') loadHistory();
  if (id === 'queue') loadQueue();
  if (id === 'manifest') loadManifest();
}

function card(label, value){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<small class="muted">${label}</small><div style="font-size:24px; font-weight:700; margin-top:6px;">${value}</div>`;
  return el;
}

async function loadSummary(){
  const data = await api('/api/summary');
  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = '';
  Object.entries(data || {}).forEach(([k,v]) => grid.appendChild(card(k, Array.isArray(v) ? v.length : v)));
}

function renderTable(headers, rows){
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`;
  const tbody = document.createElement('tbody');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = headers.map(h => `<td>${(r[h] ?? '')}</td>`).join('');
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table.outerHTML;
}

async function loadPlayers(){
  const q = document.getElementById('playerQuery').value || '';
  const data = await api('/api/players?q=' + encodeURIComponent(q));
  const rows = (data.players || []).slice(0, 250).map(p => ({
    name: p.name || p.Name,
    rating: p.rating || p.Rating,
    rarity: p.rarity || p.Rarity,
    team: p.team || p.Team || p.Club,
    nation: p.nation || p.Nation || p.Country,
    decision: p.decision || '',
    role: p.role || '',
    confidence: p.image_confidence || p.confidence || ''
  }));
  document.getElementById('playersTable').innerHTML = renderTable(['name','rating','rarity','team','nation','decision','role','confidence'], rows);
}

async function loadHistory(){
  const data = await api('/api/history');
  const rows = (data.history || []).map(h => ({snapshot_id:h.snapshot_id, imported_at:h.imported_at, source_name:h.source_name, players:h.player_count}));
  document.getElementById('historyTable').innerHTML = renderTable(['snapshot_id','imported_at','source_name','players'], rows);
  if (rows.length){
    const sid = rows[0].snapshot_id;
    const details = await api('/api/history/' + encodeURIComponent(sid) + '/players');
    const drows = (details.players || []).slice(0, 100).map(p => ({name:p.name || p.Name, rating:p.rating || p.Rating, rarity:p.rarity || p.Rarity, team:p.team || p.Team || p.Club}));
    document.getElementById('historyPlayers').innerHTML = renderTable(['name','rating','rarity','team'], drows);
  }
}

async function loadQueue(){
  const data = await api('/api/resolver-queue');
  const rows = (data.queue || []).map(q => ({name:q.name, rating:q.rating, rarity:q.rarity, reason:q.reason, confidence:q.confidence}));
  document.getElementById('queueTable').innerHTML = renderTable(['name','rating','rarity','reason','confidence'], rows);
}

async function loadManifest(){
  const data = await api('/api/manifest');
  const rows = (data.items || []).slice(0, 200).map(i => ({name:i.name, definitionId:i.definitionId, rarity:i.rarity, image_url:i.image_url || '', confidence:i.confidence || ''}));
  document.getElementById('manifestTable').innerHTML = renderTable(['name','definitionId','rarity','image_url','confidence'], rows);
}

async function refreshNow(){
  await fetch('/api/refresh', {method:'POST'});
  loadSummary();
}

loadSummary();
</script>
</body>
</html>
